# The shared release workflow. Each game's own .github/workflows/release.yml calls this,
# so a fix here reaches every game. It reads the game's release.json and builds each
# system listed there on GitHub's own machines.
#
# Archives never go through workflow artifacts: in a private repository they count
# against the account's monthly storage quota, even kept for a day, and Christmas Dash's
# builds hit it. Release files do not count.
#
# For a version tag, a hidden draft release is made first, each build uploads its
# archive straight onto it, and the draft is published only once every system's archive
# is there.
#
# A run with no tag, from the Actions page or release.py's test build, does the same
# with a hidden draft called test-build, which is never published. Each test run
# replaces the last, and its archives can be downloaded from the releases page.
name: Build and release a game

on:
  workflow_call:
    inputs:
      tool_ref:
        description: The branch or tag of game-release to build with.
        type: string
        default: main

permissions:
  contents: read

jobs:
  plan:
    name: Read release.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      python: ${{ steps.plan.outputs.python }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "game-release @ git+https://github.com/tunmi13productions/game-release@${{ inputs.tool_ref }}"
      - id: plan
        run: game-release ci-plan >> "$GITHUB_OUTPUT"
      - name: Make the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: game-release ci-draft "${{ github.ref_name }}"
      - name: Make the test-build draft
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: game-release ci-draft "${{ steps.plan.outputs.tag }}" --test

  build:
    name: Build ${{ matrix.system }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      # every system finishes, so re-running the one that failed is all a bad build needs
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache
      - name: Install the game's packages and the tool
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install "game-release @ git+https://github.com/tunmi13productions/game-release@${{ inputs.tool_ref }}"
      - name: Build and pack
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PLAN_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ "$REF_TYPE" = tag ]; then TAG="$REF_NAME"; else TAG="$PLAN_TAG"; fi
          game-release ci-build "$TAG"
      - name: Upload to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: game-release ci-upload "${{ github.ref_name }}"
      - name: Upload to the test-build draft
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: game-release ci-upload "${{ needs.plan.outputs.tag }}" --test

  release:
    name: Publish the release
    # every build must have worked, or nothing is published
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "game-release @ git+https://github.com/tunmi13productions/game-release@${{ inputs.tool_ref }}"
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: game-release ci-release "${{ github.ref_name }}"
      - name: Check the test build has every archive
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: game-release ci-release "${{ needs.plan.outputs.tag }}" --test
